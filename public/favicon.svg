<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="pandaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
  </defs>
  <!-- Background Badge -->
  <rect width="100" height="100" rx="26" fill="url(#pandaBg)" stroke="#334155" stroke-width="2" />
  
  <!-- Orelhas do Panda -->
  <circle cx="28" cy="28" r="14" fill="#0f172a" stroke="#ef4444" stroke-width="2.5" />
  <circle cx="72" cy="28" r="14" fill="#0f172a" stroke="#ef4444" stroke-width="2.5" />
  
  <!-- Cabeça do Panda -->
  <circle cx="50" cy="53" r="30" fill="#f8fafc" />
  
  <!-- Manchas dos Olhos -->
  <ellipse cx="38" cy="50" rx="8" ry="10" transform="rotate(-15 38 50)" fill="#0f172a" />
  <ellipse cx="62" cy="50" rx="8" ry="10" transform="rotate(15 62 50)" fill="#0f172a" />
  
  <!-- Brilho dos Olhos (Olhar Vermelho de Ferro) -->
  <circle cx="39" cy="48" r="3" fill="#ef4444" />
  <circle cx="61" cy="48" r="3" fill="#ef4444" />
  <circle cx="40" cy="47" r="1.2" fill="#ffffff" />
  <circle cx="62" cy="47" r="1.2" fill="#ffffff" />
  
  <!-- Focinho e Boca -->
  <ellipse cx="50" cy="62" rx="4" ry="2.8" fill="#0f172a" />
  <path d="M46 67 Q50 71 54 67" stroke="#0f172a" stroke-width="2" stroke-linecap="round" fill="none" />
</svg>
